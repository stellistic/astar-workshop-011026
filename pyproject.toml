[project]
name = "astar-fabric-workshop-kit"
version = "1.0.0"
description = "Maintainer tooling for the Astar Fabric workshop kit (data seeding, validation)."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pypdf>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tools/capture/node_modules", "tools/notebooks/src", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
